<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        console.log(`this is: ${add7(10)}`);
        console.log(`and this is: ${multiply(3, 4)}`);
        console.log(`also this is: ${capitalize("daEAdf")}`);
        console.log(`the last letter is ${lastLetter("aaaab")}`);

        function add7(num) {
            return num + 7;
        }

        function multiply(num1, num2) {
            return num1 * num2;
        }

        function capitalize(str) {
            return str[0].toUpperCase() + str.substring(1).toLowerCase();
        }

        function lastLetter(str) {
            return str.at(-1);
        }

    </script>
</body>
</html>
